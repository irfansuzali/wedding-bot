services:
  - type: worker
    name: wedding-planning-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 130s9muvmIyyRsGP8DdewBjilvgDcBDxw2zhHqlQ7U4w
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: TZ
        value: Asia/Kuala_Lumpur
